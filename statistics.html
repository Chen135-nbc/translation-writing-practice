<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统计｜翻译写作专项练习器</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./statistics.css" />
  </head>
  <body class="site-page">
    <nav class="main-nav" aria-label="主导航">
      <a class="nav-item" href="./index.html">主页</a>
      <a class="nav-item" href="./translation-library.html">翻译题库</a>
      <a class="nav-item" href="./writing-library.html">写作题库</a>
      <a class="nav-item" href="./notes.html">笔记</a>
      <a class="nav-item is-active" href="./statistics.html">统计</a>
    </nav>
    <main class="section-page">
      <header class="page-heading">
        <p class="section-kicker">学习记录</p>
        <h1>统计</h1>
        <p>查看练习投入、完成进度与最近成绩变化。</p>
      </header>
      <section class="metric-strip">
        <article><span>累计完成</span><strong>9</strong><small>题</small></article>
        <article><span>累计学习</span><strong>109</strong><small>分钟</small></article>
        <article><span>连续练习</span><strong>3</strong><small>天</small></article>
        <article><span>本周完成</span><strong>3</strong><small>/ 8 题</small></article>
      </section>
      <section class="statistics-detail">
        <article class="statistics-card">
          <header><div><p class="section-kicker">Volume</p><h2>练习量分布</h2></div><span>近 30 天</span></header>
          <div class="large-bars">
            <div><span>四级翻译</span><i style="--bar: 68%"></i><strong>12</strong></div>
            <div><span>六级翻译</span><i style="--bar: 48%"></i><strong>8</strong></div>
            <div><span>CATTI</span><i style="--bar: 28%"></i><strong>5</strong></div>
            <div><span>四六级写作</span><i style="--bar: 55%"></i><strong>10</strong></div>
            <div><span>商务写作</span><i style="--bar: 22%"></i><strong>4</strong></div>
          </div>
        </article>
        <article class="statistics-card">
          <header><div><p class="section-kicker">Performance</p><h2>最近成绩</h2></div><span>最近 5 次</span></header>
          <div class="score-history">
            <div><span>1</span><i style="height: 48%"></i><strong>62</strong></div>
            <div><span>2</span><i style="height: 58%"></i><strong>68</strong></div>
            <div><span>3</span><i style="height: 70%"></i><strong>76</strong></div>
            <div><span>4</span><i style="height: 82%"></i><strong>84</strong></div>
            <div><span>5</span><i style="height: 78%"></i><strong>81</strong></div>
          </div>
        </article>
        <aside class="statistics-card goal-card">
          <header><div><p class="section-kicker">Goal</p><h2>本周目标</h2></div></header>
          <div class="goal-ring"><strong>38%</strong></div>
          <p>已完成 3 题，距离本周目标还差 5 题。</p>
          <div class="completion-track"><i style="width: 38%"></i></div>
        </aside>
      </section>
    </main>
  </body>
</html>
