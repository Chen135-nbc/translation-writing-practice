<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笔记｜翻译写作专项练习器</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./notes.css" />
  </head>
  <body class="site-page">
    <nav class="main-nav" aria-label="主导航">
      <a class="nav-item" href="./index.html">主页</a>
      <a class="nav-item" href="./translation-library.html">翻译题库</a>
      <a class="nav-item" href="./writing-library.html">写作题库</a>
      <a class="nav-item is-active" href="./notes.html">笔记</a>
      <a class="nav-item" href="./statistics.html">统计</a>
    </nav>
    <main class="section-page">
      <header class="page-heading">
        <p class="section-kicker">个人知识库</p>
        <h1>笔记</h1>
        <p>整理练习中值得反复查看的词语、表达、句型和写作思路。</p>
      </header>
      <div class="notes-workspace">
        <section class="notes-category">
          <div class="notes-category-heading">
            <div><p class="section-kicker">Translation</p><h2>翻译笔记</h2></div>
            <span>18 条</span>
          </div>
          <div class="note-list">
            <button class="note-list-item"><strong>传统文化常用表达</strong><span>8 个词组 · 今天更新</span></button>
            <button class="note-list-item"><strong>中国特色概念译法</strong><span>12 个术语 · 昨天更新</span></button>
            <button class="note-list-item"><strong>长句拆分与逻辑衔接</strong><span>6 个例句 · 06月11日</span></button>
          </div>
          <button class="primary-action notes-action">进入翻译笔记</button>
        </section>
        <section class="notes-category">
          <div class="notes-category-heading">
            <div><p class="section-kicker">Writing</p><h2>写作笔记</h2></div>
            <span>13 条</span>
          </div>
          <div class="note-list">
            <button class="note-list-item"><strong>议论文开头与结尾</strong><span>10 个句型 · 今天更新</span></button>
            <button class="note-list-item"><strong>图表描述核心词汇</strong><span>14 个表达 · 06月12日</span></button>
            <button class="note-list-item"><strong>商务邮件语气</strong><span>7 个模板 · 06月09日</span></button>
          </div>
          <button class="primary-action notes-action">进入写作笔记</button>
        </section>
        <aside class="recent-notes">
          <p class="section-kicker">最近记录</p>
          <h2>待复习</h2>
          <div class="review-count"><strong>6</strong><span>条笔记</span></div>
          <p>这些内容来自最近三次练习，建议在下一次练习前快速复习。</p>
          <button class="secondary-action review-action">开始复习</button>
        </aside>
      </div>
    </main>
  </body>
</html>
